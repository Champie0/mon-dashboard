const FF = { month: today().slice(0, 7), acc: '', cat: '', q: '', limit: 100 };
function money(n) {
  try { return new Intl.NumberFormat('fr-CH', { style: 'currency', currency: S.finance.currency }).format(n); }
  catch (e) { return cents(n).toFixed(2) + ' ' + S.finance.currency; }
}
const monthLabel = m => { const d = parseD(m + '-01'); return d ? d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) : m; };
const shiftMonth = (m, n) => { const d = parseD(m + '-01'); d.setMonth(d.getMonth() + n); return dstr(d).slice(0, 7); };
function finStats(month) {
  const f = S.finance, bal = {}, prev = shiftMonth(month, -1), byCat = {};
  let sc = 0, sp = 0, inc = 0;
  for (const a of f.accounts) bal[a.id] = a.start;
  for (const t of f.tx) {
    bal[t.acc] = (bal[t.acc] || 0) + t.amount;
    const m = t.date.slice(0, 7);
    if (m === month) { if (t.amount < 0) { sc -= t.amount; byCat[t.cat] = (byCat[t.cat] || 0) - t.amount; } else inc += t.amount; }
    else if (m === prev && t.amount < 0) sp -= t.amount;
  }
  return { bal, total: Object.values(bal).reduce((a, b) => a + b, 0), sc, sp, inc, byCat };
}
function guessCat(label, amount) {
  const l = label.toLowerCase();
  for (const r of S.finance.rules) if (l.includes(r.kw)) return r.cat;
  return amount > 0 ? 'Revenus' : '';
}
const txKey = t => `${t.acc}|${t.date}|${(+t.amount).toFixed(2)}|${t.label.toLowerCase().replace(/\s+/g, ' ').trim()}`;
function recurring() {
  const g = new Map(), out = [], t0 = today();
  for (const t of S.finance.tx) {
    if (t.amount >= 0) continue;
    const k = t.label.toLowerCase().replace(/[\d/.,:#*_-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 28);
    if (!k) continue;
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(t);
  }
  for (const l of g.values()) {
    if (l.length < 2) continue;
    l.sort((a, b) => a.date < b.date ? -1 : 1);
    const last = l.slice(-6), gaps = [];
    for (let i = 1; i < last.length; i++) gaps.push(diffDays(last[i].date, last[i - 1].date));
    const med = gaps.slice().sort((a, b) => a - b)[gaps.length >> 1];
    const period = med >= 26 && med <= 35 ? 'chaque mois' : med >= 6 && med <= 8 ? 'chaque semaine' : med >= 350 && med <= 380 ? 'chaque année' : '';
    const amts = last.map(t => -t.amount), avg = amts.reduce((a, b) => a + b, 0) / amts.length, end = last[last.length - 1];
    if (!period || amts.some(a => Math.abs(a - avg) > avg * .15 + .5) || gaps.some(x => Math.abs(x - med) > Math.max(5, med * .1)) || diffDays(t0, end.date) > med * 2 + 10) continue;
    out.push({ label: end.label, avg, period, next: addDays(end.date, med), yearly: avg * (365 / med) });
  }
  return out.sort((a, b) => b.yearly - a.yearly);
}

function parseCSV(text) {

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }

  <section class="hud"><h2>Finances</h2>${sel('cur', 'c', S.finance.currency, ['CHF', 'EUR', 'USD', 'CAD', 'GBP'].map(c => [c, c]), 'Devise affichée')}</section>
  <section class="hud"><h2>Phrases de motivation</h2><form data-s="saveLines" data-k="quotes"><label class="f"><span>Une phrase par ligne. L’Accueil en affiche une chaque jour.</span><textarea rows="7">${esc(S.home.quotes.join('\n'))}</textarea></label><button class="btn">Enregistrer les phrases</button></form></section>
  <section class="hud"><h2>Questions du journal</h2><form data-s="saveLines" data-k="questions"><label class="f"><span>Une question par ligne. Le Journal en propose une chaque jour.</span><textarea rows="7">${esc(S.journal.questions.join('\n'))}</textarea></label><button class="btn">Enregistrer les questions</button></form></section>
  ${installCard()}
  <section class="hud"><h2>Aide</h2><p class="small" style="margin-bottom:10px">Le dashboard se pilote aussi au clavier.</p><button class="btn" data-a="help">Voir les raccourcis clavier</button></section>
  <section class="hud"><h2>Tout effacer</h2><p class="small" style="margin-bottom:10px">Supprime toutes les données ${session ? 'de votre compte' : 'de ce navigateur'}. Faites un export avant.</p><button class="btn danger" data-a="wipe">Effacer toutes mes données</button></section></div>`;
};
ACT.pref = d => { if (d.k === 'theme') prefs.theme = prefs.theme === 'light' ? 'dark' : 'light'; else prefs[d.k] = !prefs[d.k]; ls.set('prefs', prefs); applyPrefs(); render(); };
CH.cur = (d, el) => { S.finance.currency = el.value; commit('finance'); toast('Devise enregistrée.'); };
SUB.saveLines = form => {
  const list = [...new Set($('textarea', form).value.split('\n').map(x => x.trim().slice(0, 300)).filter(Boolean))];
  if (!list.length) return toast('Gardez au moins une ligne.');
  if (form.dataset.k === 'quotes') { S.home.quotes = list; commit('home'); } else { S.journal.questions = list; commit('journal'); }
  toast('Liste enregistrée.');
};
ACT.exportData = () => {
  S.home.lastExport = today(); commit('home', { silent: true });
  const data = {}; for (const m of MODULES) data[m] = S[m];
  download(`mon-dashboard-${today()}.json`, JSON.stringify({ app: APP_ID, version: SCHEMA, exportedAt: new Date().toISOString(), data }, null, 1), 'application/json');
  render(); toast('Export terminé. Gardez ce fichier en lieu sûr.');
};
ACT.importPick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = () => { if (i.files[0]) safe(async () => importText(await i.files[0].text())); }; i.click(); };
function importText(text) {
  const fail = why => infoDlg('Restauration impossible', `<p>${esc(why)}</p><p class="muted small" style="margin-top:8px">Vos données actuelles n’ont pas été modifiées.</p>`);
  let j; try { j = JSON.parse(text); } catch (e) { return fail('Ce fichier est abîmé ou n’est pas une sauvegarde : il ne peut pas être lu.'); }
  if (!isObj(j) || j.app !== APP_ID || !isObj(j.data)) return fail('Ce fichier ne vient pas de ce dashboard.');
  if (num(j.version, 1) > SCHEMA) return fail('Cette sauvegarde vient d’une version plus récente du dashboard. Mettez d’abord le dashboard à jour.');
  const ok = {}, bad = [];
  for (const m of MODULES) { if (j.data[m] === undefined) continue; try { ok[m] = normalizeModule(m, j.data[m]); } catch (e) { bad.push(MOD_LABEL[m]); } }
  const names = Object.keys(ok);
  if (!names.length) return fail('Aucun module lisible dans ce fichier.');
  const d = { ...Object.fromEntries(MODULES.map(m => [m, DEFAULTS[m]()])), ...ok };
  confirmDlg({
    title: 'Remplacer vos données par cette sauvegarde ?', danger: true, ok: 'Remplacer mes données',
    msg: `Sauvegarde du ${j.exportedAt && !isNaN(new Date(j.exportedAt)) ? new Date(j.exportedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'date inconnue'} : ${plural(d.tasks.items.length, 'tâche', 'tâches')}, ${plural(d.habits.items.length, 'habitude', 'habitudes')}, ${plural(d.goals.items.length, 'objectif', 'objectifs')}, ${plural(d.finance.tx.length, 'opération', 'opérations')}, ${plural(Object.keys(d.journal.entries).length, 'jour de journal', 'jours de journal')}, ${plural(d.reminders.items.length, 'rappel', 'rappels')}. ` +
      (bad.length ? `Modules illisibles dans le fichier, laissés tels quels : ${bad.join(', ')}. ` : '') + `Les modules restaurés (${names.map(m => MOD_LABEL[m]).join(', ')}) remplaceront vos données actuelles.`,
    onOk() { for (const m of names) { S[m] = ok[m]; corrupt.delete(m); commit(m, { silent: true }); } render(); toast('Sauvegarde restaurée.'); }
  });
}
ACT.wipe = () => confirmDlg({
  title: 'Effacer toutes vos données ?', danger: true, ok: 'Tout effacer',
  msg: `Tâches, habitudes, objectifs, finances, journal et rappels seront supprimés ${session ? 'de votre compte, sur tous vos appareils' : 'de ce navigateur'}. Cette action ne peut pas être annulée.`,
  onOk() { for (const m of MODULES) { S[m] = DEFAULTS[m](); commit(m, { silent: true }); } render(); toast('Toutes les données ont été effacées.'); }
});

/* ---------- Installation (application sur l'écran d'accueil) ---------- */
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (cur === 'reglages') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Application installée.'); if (cur === 'reglages') render(); });
ACT.install = async () => {
  if (!deferredInstall) return;
  const ev = deferredInstall; deferredInstall = null;
  try { ev.prompt(); await ev.userChoice; } catch (e) { }
  render();
};
function installCard() {
  let body;
  if (isStandalone()) body = '<p class="small"><span class="chip ok">Installée</span> Vous utilisez déjà l’application sur cet appareil.</p>';
  else if (deferredInstall) body = '<p class="small" style="margin-bottom:10px">Ajoutez le dashboard à votre écran d’accueil ou à vos applications : il s’ouvre comme une appli, sans barre d’adresse, et fonctionne aussi hors ligne.</p><button class="btn primary" data-a="install">Installer l’application</button>';
  else if (isIOS()) body = '<p class="small">Sur iPhone et iPad, ouvrez ce site dans <b>Safari</b>, touchez le bouton <b>Partager</b> (le carré avec une flèche), puis <b>Sur l’écran d’accueil</b>.</p>';
  else body = '<p class="small"><b>Android (Chrome)</b> : menu ⋮ puis <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.<br><b>Ordinateur (Chrome, Edge)</b> : icône d’installation à droite de la barre d’adresse, ou menu ⋮ puis <b>Installer Mon dashboard</b>.<br><b>Mac (Safari)</b> : Fichier puis <b>Ajouter au Dock</b>.</p><p class="muted small" style="margin-top:8px">Firefox sur ordinateur ne sait pas installer d’applications web.</p>';
  return `<section class="hud"><h2>Installer sur cet appareil</h2>${body}</section>`;
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker indisponible', e)); });

/* ---------- Connexion ---------- */
ACT.login = async () => {
  if (!FIREBASE_CONFIG.apiKey) return infoDlg('Connexion pas encore configurée', '<p>La connexion avec GitHub demande un projet Firebase, à créer une seule fois. La marche à suivre, étape par étape, est dans le fichier README du dépôt.</p><p class="muted small" style="margin-top:8px">En attendant, le dashboard fonctionne en mode local : vos données restent dans ce navigateur.</p>');
  if (!cloud) { initCloud(); return toast(navigator.onLine ? 'Préparation de la connexion… Réessayez dans un instant.' : 'Connexion impossible sans accès à Internet.'); }
  try {
    const res = await cloud.au.signInWithPopup(cloud.auth, new cloud.au.GithubAuthProvider());
    const info = cloud.au.getAdditionalUserInfo(res);
    if (info && info.username) ls.set('ghname:' + res.user.uid, info.username);
    onAuth(res.user);
    toast('Connecté. Vos données se synchronisent.');
  } catch (e) {
    if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return;
    console.warn(e);
    /* Fenêtre bloquée ou non prise en charge (mobile, application intégrée) : on bascule sur la redirection. */
    if (e && ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) {
      try { toast('Fenêtre bloquée : redirection vers GitHub…'); await cloud.au.signInWithRedirect(cloud.auth, new cloud.au.GithubAuthProvider()); return; } catch (e2) { e = e2; }
    }
    authFailDlg(e);
  }
};
function authFailDlg(e) {
  const idb = e && /Database is closing|IndexedDB|indexedDB/i.test((e.message || '') + (e.code || ''));
  infoDlg('Connexion impossible', `<p>${esc(AUTH_ERR[e && e.code] || (idb ? 'Le stockage du navigateur est bloqué ou indisponible (navigation privée, mode économie, application intégrée). Ouvrez le site dans une fenêtre de navigation normale, puis réessayez.' : '') || 'La connexion avec GitHub n’a pas abouti. Réessayez dans un instant.')}</p><p class="muted small" style="margin-top:8px">Code : ${esc((e && e.code) || (e && e.message) || 'inconnu')}</p>`);
}
ACT.logout = () => {
  if (dirty.size && (!navigator.onLine || !cloud)) return confirmDlg({ title: 'Se déconnecter maintenant ?', msg: 'Des modifications n’ont pas encore été envoyées à votre compte. Elles resteront sur cet appareil et partiront à votre prochaine connexion ici.', ok: 'Se déconnecter', onOk: () => doLogout() });
  return doLogout();
};
ACT.gateLocal = () => doLogout();

/* ---------- Démarrage ---------- */
(function init() {
  applyPrefs();
  if (session && !FIREBASE_CONFIG.apiKey) { session = null; ls.del('session'); }
  loadAll();
  route(); markFresh(); renderAll();
  initCloud();
  setTimeout(() => safe(tick), 1500);
  setInterval(() => safe(tick), 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) safe(tick); });
})();


/* ---------- Musique : Spotify ----------
   Connexion directe depuis le navigateur (OAuth PKCE, sans serveur). Le Client ID et les jetons restent sur
   cet appareil : ils ne sont ni synchronisés ni exportés. Le lecteur affiche et pilote la lecture en cours,
   sur n'importe quel appareil du compte (téléphone, ordinateur…). Piloter la lecture demande Spotify Premium.
   Sans connexion, un lien Spotify collé s'affiche dans le lecteur intégré. */
const MUSIC_SUGG = [['Lofi Beats', 'https://open.spotify.com/playlist/37i9dQZF1DWWQRwui0ExPn'], ['Deep Focus', 'https://open.spotify.com/playlist/37i9dQZF1DWZeKCadgRdKQ']];
/* Client ID de l'application Spotify « Mon dashboard » : public par conception (PKCE), donc sans risque dans le code. */
const SP_CLIENT = '9417e9f3821e492495220c75d16f6d85';
const spCid = () => ls.get('spclient', '') || SP_CLIENT;
const SP = { st: null, at: 0, n: 0, busy: false };
let musicOpen = false;
const spRedirect = () => location.origin + location.pathname;
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function spotifyEmbed(u) {
  u = String(u || '').trim();
  const m = u.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|track|artist|episode|show)\/([A-Za-z0-9]+)/) || u.match(/^spotify:(playlist|album|track|artist|episode|show):([A-Za-z0-9]+)$/);
  return m ? `https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0` : '';
}
async function spTokenCall(body) {
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(body) });
  if (!r.ok) throw new Error('token ' + r.status);
  return r.json();
}
function spStore(j, old) { ls.set('sp', { access: j.access_token, refresh: j.refresh_token || (old && old.refresh) || '', exp: Date.now() + (j.expires_in || 3600) * 1000 }); }
async function spToken() {
  const t = ls.get('sp', null); if (!t) return null;
  if (Date.now() < t.exp - 30000) return t.access;
  try { const j = await spTokenCall({ grant_type: 'refresh_token', refresh_token: t.refresh, client_id: spCid() }); spStore(j, t); return j.access_token; }
  catch (e) { ls.del('sp'); SP.st = null; renderMusic(); return null; }
}
async function spApi(method, path) {
  const tk = await spToken(); if (!tk) return null;
  try { return await fetch('https://api.spotify.com/v1' + path, { method, headers: { Authorization: 'Bearer ' + tk } }); } catch (e) { return null; }
}
async function spConnect() {
  const id = spCid();
  if (!id) return toast('Collez d’abord votre Client ID Spotify.');
  const v = b64u(crypto.getRandomValues(new Uint8Array(48))), s = b64u(crypto.getRandomValues(new Uint8Array(12)));
  const ch = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  ls.set('spv', v); ls.set('sps', s);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ client_id: id, response_type: 'code', redirect_uri: spRedirect(), code_challenge_method: 'S256', code_challenge: ch, state: s, scope: 'user-read-playback-state user-modify-playback-state' });
}
async function spCallback() {
  const q = new URLSearchParams(location.search); if (!q.has('code') && !q.has('error')) return;
  const code = q.get('code'), err = q.get('error'), okState = q.get('state') === ls.get('sps', ''), v = ls.get('spv', '');
  history.replaceState(null, '', location.pathname + location.hash);
  ls.del('spv'); ls.del('sps');
  if (err || !code || !okState || !v) { if (err || code) toast('Connexion à Spotify annulée ou refusée.'); return; }
  try { spStore(await spTokenCall({ grant_type: 'authorization_code', code, redirect_uri: spRedirect(), client_id: spCid(), code_verifier: v })); musicOpen = true; toast('Spotify est connecté.'); renderMusic(); spPoll(); }
  catch (e) { toast('Connexion à Spotify impossible : vérifiez le Client ID et l’adresse de redirection.'); }
}
const SPI = { prev: '<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg>', next: '<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M15.6 5H18v14h-2.4zM4 5l10.5 7L4 19z"/></svg>', play: '<svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>', pause: '<svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M6 4.5h4.4v15H6zM13.6 4.5H18v15h-4.4z"/></svg>' };
function renderMusic() {
  const el = $('#music'); if (!el) return;
  el.classList.toggle('open', musicOpen); el.setAttribute('aria-hidden', String(!musicOpen));
  $('#musicBtn').setAttribute('aria-pressed', String(musicOpen));
  const connected = !!ls.get('sp', null), url = ls.get('music', ''), src = spotifyEmbed(url), cid = ls.get('spclient', '');
  const key = connected ? 'c' : 'e|' + src + '|' + cid;
  if (el.dataset.key === key && el.firstChild) return;   /* l'iframe ne bouge pas : la musique continue quand on navigue */
  el.dataset.key = key;
  if (connected) {
    el.innerHTML = `<div class="sp-dev" role="group" aria-label="Lecteur Spotify">
      <div class="sp-art"><img id="spArt" alt="" hidden><div id="spNone" class="sp-none">♪</div></div>
      <div class="sp-info"><b id="spTitle">Chargement…</b><span id="spSub"></span></div>
      <div class="sp-bar" aria-hidden="true"><i id="spBar"></i></div>
      <div class="sp-ctl"><button data-a="spPrev" aria-label="Précédent">${SPI.prev}</button><button data-a="spToggle" id="spTog" aria-label="Lecture / pause">${SPI.play}</button><button data-a="spNext" aria-label="Suivant">${SPI.next}</button></div></div>
      <div class="row"><span class="small muted grow" id="spDev"></span><button class="btn sm ghost" data-a="spOff" type="button">Déconnecter</button></div>`;
    spPaint(); return;
  }
  el.innerHTML = `<h2>Musique</h2>
    <button class="btn primary" data-a="spLogin" type="button" style="width:100%">Connecter mon Spotify</button>
    <details class="sp-connect" style="margin-top:var(--sp-2)"><summary>Utiliser ma propre application Spotify</summary>
      <ol class="small muted"><li>Sur <b>developer.spotify.com/dashboard</b>, créez une application.</li><li>Adresse de redirection à y saisir :<input type="text" readonly value="${A(spRedirect())}" aria-label="Adresse de redirection"></li><li>Collez ici son <b>Client ID</b> :</li></ol>
      <form data-s="spClient"><input type="text" name="c" placeholder="Client ID" aria-label="Client ID Spotify" value="${A(cid)}" autocomplete="off"><button class="btn sm primary" type="submit">Connecter</button></form>
      <p class="small muted">Piloter la lecture demande Spotify Premium.</p></details>
    <p class="small muted" style="margin:var(--sp-2) 0">Ou collez un lien pour l’écouter directement ici :</p>
    <form data-s="musicSet"><input type="text" name="u" placeholder="Lien Spotify (playlist, album, titre)" aria-label="Lien Spotify" value="${A(url)}" autocomplete="off"><button class="btn sm" type="submit">OK</button></form>` +
    (src ? `<iframe src="${A(src)}" title="Lecteur Spotify" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe><div class="row"><button class="btn sm ghost" data-a="musicClear" type="button">Retirer</button></div>`
      : `<div class="sugg">${MUSIC_SUGG.map(([n, u2]) => `<button class="btn sm" type="button" data-a="musicPick" data-u="${A(u2)}">${esc(n)}</button>`).join('')}</div>`);
}
function spPaint() {
  if (!$('#spTitle')) return;
  const s = SP.st, it = s && s.item;
  const img = it && it.album && it.album.images && it.album.images[0], art = $('#spArt');
  if (img) { if (art.getAttribute('src') !== img.url) art.src = img.url; art.hidden = false; $('#spNone').hidden = true; } else { art.hidden = true; $('#spNone').hidden = false; }
  $('#spTitle').textContent = it ? it.name : 'Rien en lecture';
  $('#spSub').textContent = it ? (it.artists || []).map(x => x.name).join(', ') : 'Lancez un titre dans Spotify (téléphone, ordinateur…) : il apparaîtra ici.';
  const pos = it ? Math.min(it.duration_ms, (s.progress_ms || 0) + (s.is_playing ? Date.now() - SP.at : 0)) : 0;
  $('#spBar').style.width = (it && it.duration_ms ? pos / it.duration_ms * 100 : 0) + '%';
  $('#spTog').innerHTML = s && s.is_playing ? SPI.pause : SPI.play;
  $('#spDev').textContent = s && s.device ? 'Sur : ' + s.device.name : '';
}
async function spPoll() {
  if (!musicOpen || !ls.get('sp', null) || SP.busy) return;
  SP.busy = true;
  try { const r = await spApi('GET', '/me/player'); if (r) { if (r.status === 204) SP.st = null; else if (r.ok) { SP.st = await r.json(); SP.at = Date.now(); } } } finally { SP.busy = false; }
  spPaint();
}
setInterval(() => { if (!musicOpen || !ls.get('sp', null)) return; spPaint(); if (++SP.n % 4 === 0) spPoll(); }, 1000);
async function spCmd(method, path) {
  const r = await spApi(method, path);
  if (r && r.status === 403) toast('Spotify Premium est nécessaire pour piloter la lecture d’ici.');
  else if (r && r.status === 404) toast('Aucun appareil actif : lancez d’abord un titre dans Spotify.');
  else if (r && !r.ok && r.status !== 204) toast('Spotify n’a pas répondu (' + r.status + ').');
  setTimeout(spPoll, 450);
}
ACT.musicToggle = () => { musicOpen = !musicOpen; renderMusic(); if (musicOpen) spPoll(); };
ACT.musicPick = d => { ls.set('music', d.u); renderMusic(); };
ACT.musicClear = () => { ls.del('music'); renderMusic(); };
ACT.spLogin = () => spConnect();
ACT.spPrev = () => spCmd('POST', '/me/player/previous');
ACT.spNext = () => spCmd('POST', '/me/player/next');
ACT.spToggle = () => spCmd('PUT', SP.st && SP.st.is_playing ? '/me/player/pause' : '/me/player/play');
ACT.spOff = () => { ls.del('sp'); SP.st = null; renderMusic(); toast('Spotify déconnecté de ce navigateur.'); };
SUB.musicSet = f => { const v = f.elements.u.value.trim(); if (!spotifyEmbed(v)) return toast('Ce lien n’est pas un lien Spotify (open.spotify.com/playlist/…).'); ls.set('music', v); renderMusic(); };
SUB.spClient = f => { const v = f.elements.c.value.trim(); if (!/^[a-f0-9]{32}$/i.test(v)) return toast('Un Client ID Spotify fait 32 caractères (lettres a–f et chiffres).'); ls.set('spclient', v); spConnect(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && musicOpen && !$('#dlg').open) { musicOpen = false; renderMusic(); } });
renderMusic(); spCallback();

/* Reflet de verre qui suit le curseur (purement visuel). */
(() => {
  if (matchMedia('(pointer:coarse)').matches) return;
  let raf = 0, ev = null;
  document.addEventListener('pointermove', e => {
    ev = e; if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0; const el = ev.target.closest && ev.target.closest('.hud,.kpi,.path-s'); if (!el) return;
      const r = el.getBoundingClientRect(); el.style.setProperty('--mx', (ev.clientX - r.left) + 'px'); el.style.setProperty('--my', (ev.clientY - r.top) + 'px');
    });
  }, { passive: true });
})();
</script>
